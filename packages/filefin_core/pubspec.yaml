name: filefin_core
description: >-
  Pure-Dart core for the FileFin client: wire models, extension-type IDs, URL
  construction, the resume/progress engine and the playback decision. I/O-free,
  Flutter-free and deterministic (CLAUDE.md §6).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.8.0

# Resolved against the workspace root's single lockfile, so `codegen-check` and
# `mutants` see the same package versions on every machine.
resolution: workspace

dependencies:
  # The @freezed annotation on every wire model. Pure Dart — it pulls in no
  # Flutter, which is what lets §6 hold. Pinned exactly: freezed's own pubspec
  # pins its annotation package, and generated output must be reproducible.
  freezed_annotation: 3.1.0
  # @JsonKey / @JsonSerializable and the JsonConverter base class the four ID
  # converters extend. Pinned exactly: json_serializable's output must be
  # byte-identical across machines or `just codegen-check` fails on a diff
  # nobody made.
  json_annotation: 4.12.0
  # @immutable on the hand-written value types (FileFinUrls, the resume state)
  # that freezed does not generate. Without it the analyzer cannot warn when one
  # of them grows a mutable field.
  meta: 1.18.0

dev_dependencies:
  # Runs the two builders below; `just codegen-check` invokes it per package.
  # Caret rather than pinned: freezed 3.2.5 caps `analyzer` below 11, which
  # rules out build_runner 2.16. pubspec.lock is what pins the outcome.
  build_runner: ^2.4.0
  # Generates ==, hashCode, copyWith and toJson/fromJson wiring for the wire
  # models. Pinned exactly for the same reason as its annotation package.
  freezed: 3.2.5
  # Generates the tolerant fromJson/toJson bodies. Pinned exactly: a patch
  # release that reformats its output turns `codegen-check` into a diff nobody
  # made.
  json_serializable: 6.14.1
  # Property-based tests for the resume engine. Pinned exactly, and the seed is
  # pinned in the test: `just mutants` runs `dart test` once per mutant, so a
  # generator that draws a different sample each run turns a surviving mutant
  # into a coin flip.
  #
  # NOT glados, which the plan named. Every published glados version declares
  # `sdk: >=2.12.0 <3.0.0` and cannot resolve on any Dart 3 SDK; STATE.md
  # records that. kiri_check is the maintained Dart 3 equivalent and shrinks
  # counterexamples, which is the property a hand-rolled loop would not give.
  kiri_check: 1.3.1
  # The test runner `just test` and `just coverage` invoke.
  test: ^1.25.0
