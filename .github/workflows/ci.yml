name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# Actions are pinned to commit SHAs, not tags. A tag is mutable, and a mutable
# reference in CI means the thing that gated yesterday's commit is not
# necessarily the thing that gates today's.
jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # `just mutants` diffs against FILEFIN_MUTANTS_BASE, which the
          # `just check` step below sets to the PR base sha or HEAD^. Neither
          # resolves in a shallow clone.
          fetch-depth: 0

      - name: Set up Flutter (bundles the Dart SDK)
        # subosito/flutter-action v2.23.0. Flutter rather than dart-lang/setup-dart
        # because it bundles a matching Dart, so nothing here changes at M3 when
        # the Flutter app arrives and `just test` gains `flutter test`.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Set up Node (for the jscpd duplication gate)
        # actions/setup-node v6.5.0. `just dupes` FAILS when npx is absent
        # rather than skipping, so this step is not optional.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Install libmpv and jq
        # `just check` runs `apps/mobile/test/playback/real_mpv_player_test.dart`,
        # which drives a REAL mpv context headlessly — media_kit's core is pure
        # Dart over `dart:ffi`, so a `Player` constructs under `flutter test`
        # (measured at M4.0/E2). That suite FAILS when libmpv is absent rather
        # than skipping, and `just toolchain-check` refuses first, so this step
        # is not optional.
        #
        # `libmpv2`, not `libmpv-dev`: measured in an `ubuntu:24.04` container
        # (M4.0/E8), the runtime package installs `libmpv.so.2` and
        # `dlopen("libmpv.so.2")` finds it, which is the second entry in
        # media_kit's own Linux default-name list. The unversioned `libmpv.so`
        # that `libmpv-dev` adds was absent and is not needed — nothing here
        # compiles against the headers.
        #
        # `jq` is here because `tool/check-fixtures.sh:61` refuses without it
        # and the structural half of the §8 gate cannot run — and until M7.R it
        # was never installed. It worked only because the `ubuntu-latest` image
        # happens to ship jq, which is a dependency on an image's contents
        # rather than on anything this workflow states. Installing it makes the
        # dependency true rather than lucky.
        run: sudo apt-get update && sudo apt-get install -y libmpv2 jq

      - name: Set up just
        # extractions/setup-just v4.0.0
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3

      - name: Install the git hooks
        # `just check` runs `hooks-status`, which FAILS when the hooks are not
        # installed. That is the point of the gate — so CI installs them rather
        # than being exempted from it.
        run: just install-hooks

      - name: Resolve dependencies
        # `flutter pub get`, not `dart pub get`, and the reason is NOT the one
        # you would guess. Measured at M3.0 on Flutter 3.44.9: `dart pub get`
        # resolves this workspace perfectly well once `apps/mobile` joined it,
        # because the `dart` on PATH here is the Flutter SDK's own and knows
        # how to resolve `sdk: flutter`. It exits 0 and writes a correct
        # lockfile.
        #
        # What it does NOT write is `apps/mobile/.flutter-plugins-dependencies`,
        # which is how a plugin (`path_provider`, from M3.5) gets registered
        # with the Android and iOS builds. `flutter pub get` writes it.
        # Measured both ways: absent after `dart pub get`, present after
        # `flutter pub get`.
        run: flutter pub get

      - name: just check
        # FILEFIN_MUTANTS_BASE is load-bearing, not decoration. CI checks out a
        # commit, so the working tree IS HEAD; with the default base of HEAD the
        # mutation gate diffed a commit against itself, found no changed Dart,
        # printed "nothing to mutate" and exited 0 — on every PR and every push,
        # for the one gate §3 leans on hardest. tool/check-mutants.sh now REFUSES
        # that combination when $CI is set, so this step fails loudly if the
        # variable is ever dropped again rather than going quietly green.
        #
        # On a PR the base is the merge target, so the whole branch is mutated.
        # On a push it is HEAD^ — the one commit that just landed. The empty-tree
        # object is the fallback for a root commit, where everything is new.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
          else
            base="$(git rev-parse --verify --quiet HEAD^ || git hash-object -t tree /dev/null)"
          fi
          echo "mutation base: $base"
          FILEFIN_MUTANTS_BASE="$base" just check

# There is deliberately no fixture-capture job.
#
# Capturing fixtures needs a real `filefin` binary built from upstream (Go plus
# a Node web build) and a seeded data directory. That is a genuine piece of
# work, not a checkbox, and a job that quietly skips when the binary is absent
# would report success while checking nothing — the exact failure mode
# CLAUDE.md's "gates must be able to fail" section describes.
#
# What CI *does* enforce is `just fixtures-verify`, inside `just check`: the
# committed fixtures must match their SHA-256 manifest and still satisfy every
# structural assertion. So a fixture edited by hand fails CI even though CI
# never talks to a server. Re-capture is a local, deliberate act
# (`just fixtures-seed && just fixtures-capture`), recorded in
# test/fixtures/PROVENANCE.md. STATE.md carries this as accepted debt.
