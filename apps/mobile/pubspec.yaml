name: filefin_mobile
description: >-
  The FileFin mobile client: the app shell, the category tree, the virtualised
  poster grid and the detail view. The only layer in this tree that draws
  anything, and the only one that may depend on Flutter (CLAUDE.md §6).
publish_to: none
version: 0.1.0

environment:
  # Matches the workspace root and both packages. Deliberately NOT the
  # `^3.12.2` `flutter create` writes: a member declaring a language version
  # above the root's would let code compile here that cannot compile in
  # `filefin_core`, and the scaffolded `main.dart` this replaces used the 3.12
  # dot-shorthand syntax that the rest of the tree cannot read.
  sdk: ^3.8.0

# Resolved against the workspace root's single lockfile, so `just mutants` and
# `just coverage-check` see the same package versions on every machine.
resolution: workspace

# §1 and §4: a dependency arrives in the commit that first imports it, and
# every non-SDK version is pinned exactly per docs/architecture.md's "exact on
# introduction" (reconciled with CLAUDE.md §4 at M3). `path_provider` and the
# two platform-interface packages that make `main()` coverable arrived with
# M3.5 and are declared below.
dependencies:
  # F14's whole platform half: Android's `MediaSession` plus the foreground
  # service that stops the OS muting a backgrounded player, and iOS's
  # `MPNowPlayingInfoCenter` / `MPRemoteCommandCenter`. Imported by exactly one
  # file, `playback/audio_service_media_session.dart`, which is the adapter
  # behind `MediaSessionHost`.
  #
  # It is a package rather than our own channel code for a testability reason
  # that is measured rather than assumed: `AudioServicePlatform.instance` is a
  # settable platform interface — the same seam `PathProviderPlatform` gives —
  # so what F14 publishes and what a remote button does are both assertable
  # headlessly. Hand-written Kotlin and Swift behind the same port would be a
  # boundary nothing in `just check` could reach.
  #
  # E-6 measured this exact package driving this exact engine: with it running,
  # a backgrounded player reports `mutedState:none` where the bare arm reports
  # `mutedState:opControlAudio`, and `KEYCODE_MEDIA_PAUSE` reaches Dart
  # (`docs/risks.md` R3).
  audio_service: 0.18.19
  # F13's only signal about the connection. Its `onConnectivityChanged` is not
  # used — SPEC F13 samples once, before playing — but `checkConnectivity()` is,
  # and it is the only cross-platform way to ask.
  connectivity_plus: 7.3.1
  # The only layer allowed to open a socket: typed endpoints, the cookie jar,
  # F3's 401 retry, F15's pinning — and `CancelToken`, re-exported from its
  # barrel so this package never imports dio (`app_no_raw_http`). A path
  # dependency, not a version: they move together and there is nothing to
  # publish.
  filefin_api:
    path: ../../packages/filefin_api
  # The wire models, the extension-type IDs, `FileFinUrls` and
  # `buildCategoryTree`. Same reasoning on the path.
  filefin_core:
    path: ../../packages/filefin_core
  # The framework this package's whole lib/ is written in.
  flutter:
    sdk: flutter
  # `BaseCacheManager` only, and only so that we can decline it.
  # `AudioService.init` otherwise constructs a `DefaultCacheManager()`
  # unconditionally, which opens a **sqflite database** for artwork the moment
  # a session starts. F14 publishes no `artUri` — the poster route is behind
  # `s.auth` and every artwork API takes a URI the OS fetches for itself — so
  # that database would be written by nothing and read by nothing (§1).
  # `NoArtworkCache` is the stub handed to `init` instead, and every one of its
  # methods throws.
  flutter_cache_manager: 3.4.2
  # F2's persistence half: the Keychain on iOS and an AES-GCM Keystore-wrapped
  # store on Android, which is the only place §9 permits a password to live.
  # `PlatformSecretStore` imports it; nothing else may.
  #
  # 10.3.1 rather than the current 11.0.0, and the reason is measured (M7.0/E-5)
  # rather than caution: 11.0.0's Android module declares `compileSdk = 37`,
  # which needs an `android-37` platform that Flutter 3.44.9's own
  # `flutter.compileSdkVersion` (36) does not ask for, and `flutter build apk`
  # failed with "Failed to find target with hash string 'android-37'". 10.3.1
  # declares 36 — exactly what the toolchain provides — and builds. Both floors
  # are below C5's: `minSdkVersion 23` against our 26, `ios.deployment_target
  # 13.0` against our 15, and the merged manifest and the built plist still say
  # 26 and 15.0 with it in.
  flutter_secure_storage: 10.3.1
  # SPEC C2's playback engine. Pure Dart over `dart:ffi` — only its `_video`
  # sibling is a Flutter plugin — which is the seam `MediaKitPlaybackHost` is
  # built on: a `Player` constructs under `flutter test` against a host libmpv.
  media_kit: 1.2.6
  # The prebuilt libmpv the Android build links. Consumed by Gradle through
  # `.flutter-plugins-dependencies`, never imported — see tool/dep-allowlist.txt.
  media_kit_libs_android_video: 1.3.8
  # The prebuilt libmpv the iOS build links, consumed by Xcode the same way.
  media_kit_libs_ios_video: 1.1.4
  # `Video` and `VideoController` — the texture that puts libmpv's output on
  # screen. The only platform-channel call in the playback path.
  media_kit_video: 2.0.1
  # `@immutable` on `UiState` and the value types beside it. Without it the
  # analyzer will not accept an `==`/`hashCode` override on a class it cannot
  # see is immutable — which the poster ImageProvider's cache key needs.
  #
  # Exact, per §4, and it arrived at M3 with a caret and no recorded reason.
  # `meta` is what `@immutable` and `@internal` come from, and a patch release
  # of it changes what the analyzer accepts — which `just analyze
  # --fatal-infos` turns straight into a red gate on a machine that resolved a
  # different version.
  meta: 1.18.0
  # `getApplicationSupportDirectory()` — the one directory SPEC.md §7's
  # `settings.json` may live in. Called from exactly one line, in `main()`;
  # everything downstream takes an injected `Directory`, so no other test in
  # this package needs a platform channel.
  path_provider: 2.1.5

dev_dependencies:
  # `AudioServicePlatform.instance` is the seam that covers F14's adapter
  # headlessly — the same shape as `PathProviderPlatform.instance` below, and
  # the reason `audio_service` was chosen over channel code we would write
  # ourselves. The fake in `test/support/fake_audio_service_platform.dart`
  # implements it, so both what CROSSED the boundary and what the OS sends back
  # are assertable without a device.
  audio_service_platform_interface: 0.1.3
  # `ConnectivityPlatform.instance` is the seam that covers
  # `ConnectivityNetworkStatus` headlessly, exactly as
  # `PathProviderPlatform.instance` covers `main()`'s directory lookup.
  connectivity_plus_platform_interface: 2.1.0
  # The runner `just test`, `just coverage` and `just it` invoke for this
  # package. `flutter test`, not `dart test` — see tool/run-tests.sh.
  flutter_test:
    sdk: flutter
  # `PathProviderPlatform.instance` is the seam that covers `main()`'s
  # directory lookup headlessly. Without it that one line is uncoverable and
  # `MAX_UNCOVERED=0` would have to rise for it.
  path_provider_platform_interface: 2.1.2
  # `PathProviderPlatform` extends `PlatformInterface`, whose constructor
  # asserts on a verification token, so the fake needs `MockPlatformInterface`
  # to be accepted as an implementation of it.
  plugin_platform_interface: 2.1.8

# `cupertino_icons` and `flutter_lints` were deleted from `flutter create`'s
# output in the same commit that produced it. Nothing imports the first, and
# the tree's lint set is `very_good_analysis` via the root
# `analysis_options.yaml` this package includes (§1, §4).
flutter:
  # Ships the Material icon font. `Icons.*` glyphs render as boxes without it,
  # and the empty state's server glyph is one.
  uses-material-design: true
